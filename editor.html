<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лента сезона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Переменные и стили ленты взяты из index.html без изменений: редактор должен
   выглядеть продолжением сайта, а не отдельной программой. Ниже добавлено
   только то, чего на сайте нет, — выделение, ручка растягивания и панель. */
:root{
  --bg:#ffffff;--fg:#1b1b1a;--fg2:#6b6b66;--fg3:#96968f;
  --line:#e4e4de;--line2:#c8c8c0;--panel:#f1f1ec;--danger:#8c2b2b;--skip:#eeeeea;
  --sh:0 1px 2px rgba(0,0,0,.10);--half:#f3f3ef;--hatch:#d9d9d2;--today:#fafaf6;
  /* цвета предметов: 1 астрофиз, 2 сферка, 3 небмех, 4 оптика, 5 прак, 6 без предмета.
     Фон и акцент — пара тонов из таблицы курсов один в один, текст общий #1b1b1a:
     так же устроены обложки постов, чтобы сайт и канал не расходились.
     --cNm (акцент) — пунктир призраков у перенесённых занятий */
  --c1b:#c9daf8;--c1f:#1b1b1a;--c1m:#a4c2f4;
  --c2b:#d9ead3;--c2f:#1b1b1a;--c2m:#b6d7a8;
  --c3b:#f4cccc;--c3f:#1b1b1a;--c3m:#ea9999;
  --c4b:#d9d2e9;--c4f:#1b1b1a;--c4m:#b4a7d6;
  --c5b:#ead1dc;--c5f:#1b1b1a;--c5m:#d5a6bd;
  --c6b:#f1f1ec;--c6f:#1b1b1a;--c6m:#e4e4de;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1a18;--fg:#eceae6;--fg2:#a2a29a;--fg3:#78786f;
  --line:#32322e;--line2:#4a4a44;--panel:#232320;--danger:#e08b8b;--skip:#2a2a27;
  --sh:0 1px 2px rgba(0,0,0,.40);--half:#242421;--hatch:#3a3a35;--today:#1f1f1c;
  --c1b:#12233f;--c1f:#c9daf8;--c1m:#a4c2f4;
  --c2b:#25331e;--c2f:#d9ead3;--c2m:#b6d7a8;
  --c3b:#3c1616;--c3f:#f4cccc;--c3m:#ea9999;
  --c4b:#241e33;--c4f:#d9d2e9;--c4m:#b4a7d6;
  --c5b:#331f29;--c5f:#ead1dc;--c5m:#d5a6bd;
  --c6b:#2c2c26;--c6f:#f1f1ec;--c6m:#e4e4de;
}}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1{font-size:19px;font-weight:600;margin:0 0 2px}
.sub{color:var(--fg2);font-size:13px;margin:0 0 4px}
.hint{font-size:11px;color:var(--fg3);margin:0 0 12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;
     padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg2);font-size:13px;padding:4px 9px;
            border-radius:7px}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:var(--sh)}
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;--tn:190px}
.tg{display:grid;min-width:min-content}
.tg>div{min-width:0}
.tn{position:sticky;left:0;z-index:2;background:var(--bg);padding:8px 12px 8px 12px;border-right:1px solid var(--line)}
.tn .nm{font-weight:600;font-size:13px;line-height:1.25}
.tn .mt{font-size:11px;color:var(--fg2);margin-top:1px}
.tn.hd{border-bottom:1px solid var(--line)}
.tmo{font-size:11px;color:var(--fg2);padding:8px 6px 0;border-left:1px solid var(--line);white-space:nowrap}
.tmo.first{border-left:0}
.twk{font-size:12px;text-align:center;padding:2px 0 7px;color:var(--fg2);border-bottom:1px solid var(--line);
  cursor:pointer;font-variant-numeric:tabular-nums}
.twk span{display:inline-block;min-width:24px;height:22px;line-height:22px;border-radius:11px;padding:0 3px}
.twk:hover span{background:var(--panel)}
.twk.now span{background:var(--fg);color:var(--bg);font-weight:600}
.tcl{display:flex;align-items:center;padding:0;min-height:48px}
.tn.sep,.tcl.sep{border-top:1px solid var(--line)}
.tcl.now{background:var(--today)}
.tbar{flex:1;height:26px;margin:0 1px;display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;position:relative}
.tbar.l{border-top-left-radius:13px;border-bottom-left-radius:13px;margin-left:3px}
.tbar.r{border-top-right-radius:13px;border-bottom-right-radius:13px;margin-right:3px}
.tbar:hover{filter:brightness(.96)}
.tbar.x{opacity:.45;text-decoration:line-through}
.tbar.mv::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:3px;background:currentColor}
.twk.off{color:var(--fg3)}
.tskip{display:flex;align-items:center;justify-content:center;margin:4px 1px;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 7px)}
.tskip{cursor:pointer}
.tskip.sel{outline:2px solid var(--fg);outline-offset:-2px;border-radius:6px}
.tskip span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--fg2);background:var(--bg);
  padding:6px 1px;border-radius:4px;white-space:nowrap}
.tskip.wide span{writing-mode:horizontal-tb;transform:none;padding:2px 8px}
.tsec{grid-column:1 / -1;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2);padding:5px 0}
.tsec span{position:sticky;left:12px;padding-left:12px}
@media (max-width:560px){.tl{--tn:128px}.tn{padding:8px}}

/* --- то, чего нет на сайте: правка --- */
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 76px}
.tbar{touch-action:none;-webkit-user-select:none;user-select:none}
.tbar.sel{outline:2px solid var(--fg);outline-offset:-2px}
.tn.sel .nm{text-decoration:underline;text-decoration-thickness:2px}
.tn{cursor:pointer}
.grip{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:ew-resize;z-index:3}
.grip::after{content:"";position:absolute;right:4px;top:50%;transform:translateY(-50%);
             width:2px;height:10px;border-radius:1px;background:currentColor;opacity:.35}
.tbar.new{outline:1px dashed var(--line2);outline-offset:-2px}

.panel{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px 14px 10px;background:var(--panel);
       border-bottom:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.14);
       max-height:72vh;overflow:auto}
.panel.off{display:none}
.phd{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.phd b{font-size:15px}
.phd span{color:var(--fg2);font-size:12px}
.phd button{margin-left:auto}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row label{width:104px;color:var(--fg2);font-size:12px;flex:none}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line2);
      border-radius:8px;padding:7px 9px;font-family:inherit;font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;padding:0;font-size:16px}
.step b{min-width:74px;text-align:center}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:8px;
       padding:6px 11px;font-family:inherit;font-size:13px;cursor:pointer;
       -webkit-user-select:none;user-select:none;white-space:nowrap}
button.main{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.off{display:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);
      border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:6px;align-items:center}
.foot .n{color:var(--fg2);font-size:12px;flex:1;min-width:0;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
.err{color:var(--danger);font-size:12px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Лента сезона</h1>
  <p class="sub" id="sub">загрузка…</p>
  <p class="hint">Тяните занятия — сдвинется начало курса. Тяните за правый край — изменится длина.
     Новый курс встаёт в ряд выбранного; поток, группу и день недели можно сменить в панели.</p>
  <div id="view"></div>
  <p class="err" id="err"></p>
</div>

<div class="panel off" id="panel">
  <div class="phd"><b id="p-title">курс</b><span id="p-where"></span>
    <button id="close">Свернуть</button></div>
  <div class="row slotonly"><label>поток</label><span class="seg" id="f-stream"></span></div>
  <div class="row slotonly"><label>группа</label><span class="seg" id="f-groups"></span>
    <input id="f-group" class="off" placeholder="5-6"></div>
  <div class="row slotonly"><label>день</label><span class="seg" id="f-wd"></span></div>
  <div class="row pauseonly"><label>поток</label><span class="seg" id="f-pstream"></span></div>
  <div class="row pauseonly"><label>причина</label><input id="f-why" placeholder="очные сборы"></div>
  <div class="row pauseonly"><label>недель</label>
    <span class="step"><button data-pn="-1">−</button><b id="f-plen">1</b><button data-pn="1">+</button></span>
  </div>
  <div class="row pauseonly"><label>с недели</label>
    <span class="step"><button data-pw="-1">◀</button><b id="f-pstart">—</b><button data-pw="1">▶</button></span>
  </div>
  <div class="row courseonly"><label>предмет</label><span class="seg" id="f-subj"></span></div>
  <div class="row courseonly"><label>часть</label><span class="seg" id="f-part"></span></div>
  <div class="row courseonly"><label>название</label><input id="f-name"></div>
  <div class="row courseonly"><label>преподаватель</label><span class="seg" id="f-teachers"></span></div>
  <div class="row courseonly"><input id="f-teacher" class="off" placeholder="Мигаль Т."></div>
  <div class="row courseonly"><label>время</label><input id="f-time" placeholder="18:00" inputmode="numeric"></div>
  <div class="row courseonly"><label>минут</label><input id="f-dur" placeholder="90" inputmode="numeric"></div>
  <div class="row courseonly"><label>занятий</label>
    <span class="step"><button data-n="-1">−</button><b id="f-count">0</b><button data-n="1">+</button></span>
  </div>
  <div class="row courseonly"><label>начало</label>
    <span class="step"><button data-w="-1">◀</button><b id="f-start">—</b><button data-w="1">▶</button></span>
  </div>
  <div class="acts">
    <button id="drop" class="off">Убрать курс</button>
    <button id="dropause" class="off">Убрать паузу</button>
  </div>
</div>

<div class="foot">
  <span class="n" id="n">правок нет</span>
  <button id="add">+ курс</button>
  <button id="addpause">+ пауза</button>
  <button id="reset">Сброс</button>
  <button class="main" id="send">Отправить</button>
</div>

<script src="schedule.js"></script>
<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* Даты и мелкие помощники — те же, что на сайте. */
function D(s){var p=String(s).split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function iso(d){return d.toISOString().slice(0,10);}
function addD(d,n){return new Date(d.getTime()+n*86400000);}
function monday(d){return addD(d,-((d.getUTCDay()+6)%7));}
function wdIdx(d){return (d.getUTCDay()+6)%7;}
function fmt(d){return ("0"+d.getUTCDate()).slice(-2)+"."+("0"+(d.getUTCMonth()+1)).slice(-2);}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];});}
var WDS=["пн","вт","ср","чт","пт","сб","вс"];
var MN=["январь","февраль","март","апрель","май","июнь","июль","август",
        "сентябрь","октябрь","ноябрь","декабрь"];
var SUBJ=[["sferka",/сферк/i],["nebmeh",/небмех|небесн/i],["astro",/астро/i],
          ["optics",/оптик/i],["prac",/прак/i]];
function subjRank(s){
  for(var i=0;i<SUBJ.length;i++)
    if(s.subject?s.subject===SUBJ[i][0]:SUBJ[i][1].test(s.name))return i;
  return SUBJ.length;
}
function slotLabel(c){return c.time?WDS[wdIdx(D(c.start))]+" "+c.time:"время уточняется";}

var data = typeof SCHEDULE !== "undefined" ? SCHEDULE : null;
var courses=[], skips={}, skipsWas={}, streams=[], sel=null, selP=null, newN=0, drag=null;

function load(){
  streams=(data.streams||[]).map(function(st){
    skips[st.id]={};
    (st.skips||[]).forEach(function(k){
      var dt=typeof k==="string"?k:k.date;
      skips[st.id][iso(monday(D(dt)))]=(typeof k==="string"?"":k.reason)||"нет занятий";
    });
    (st.series||[]).forEach(function(s){
      courses.push({key:s.id, stream:st.id, streamName:st.name||st.id, group:s.group,
        name:s.name, teacher:s.teacher||"", time:s.time||"", dur:s.duration||"",
        count:s.count, start:s.start, color:s.color||1, subject:s.subject,
        was:{name:s.name,teacher:s.teacher||"",time:s.time||"",dur:s.duration||"",
             count:s.count,start:s.start}});
    });
    skipsWas[st.id]=JSON.parse(JSON.stringify(skips[st.id]));
    return {id:st.id, name:st.name||st.id};
  });
}

/* Пауза — это неделя потока, на которой занятий нет. Соседние недели с одной и
   той же причиной показываются одной плашкой, поэтому и правятся как одна. */
function pauseRun(stream,monday){
  var why=skips[stream][monday], from=monday, to=monday;
  while(skips[stream][iso(addD(D(from),-7))]===why)from=iso(addD(D(from),-7));
  while(skips[stream][iso(addD(D(to),7))]===why)to=iso(addD(D(to),7));
  var len=Math.round((D(to)-D(from))/(7*86400000))+1;
  return {stream:stream, from:from, len:len, why:why};
}
function setPause(p,from,len,why){
  var old=pauseRun(p.stream,p.from);
  for(var i=0;i<old.len;i++)delete skips[p.stream][iso(addD(D(old.from),i*7))];
  for(i=0;i<len;i++)skips[p.stream][iso(addD(D(from),i*7))]=why;
  selP={stream:p.stream, from:from};
}

/* Недели, которые занимает курс: шаг в неделю, пропущенные недели потока
   перескакиваем. То же правило у бота и на сайте. */
function weeksOf(c){
  var out=[], w=monday(D(c.start)), guard=0;
  while(out.length<c.count && guard++<300){
    if(!skips[c.stream][iso(w)]) out.push(iso(w));
    w=addD(w,7);
  }
  return out;
}

function sections(){
  var keys=[],by={};
  courses.forEach(function(c){
    var k=c.stream+"|"+c.group;
    if(!by[k]){by[k]={stream:c.stream,streamName:c.streamName,group:c.group,rows:[]};keys.push(k);}
    by[k].rows.push(c);
  });
  keys.sort();
  return keys.map(function(k){
    var sec=by[k];
    sec.rows.sort(function(a,b){return subjRank(a)-subjRank(b)||(a.start<b.start?-1:1);});
    return sec;
  });
}

function allWeeks(){
  var lo=null,hi=null;
  courses.forEach(function(c){
    var occ=weeksOf(c); if(!occ.length)return;
    if(!lo||occ[0]<lo)lo=occ[0];
    if(!hi||occ[occ.length-1]>hi)hi=occ[occ.length-1];
  });
  Object.keys(skips).forEach(function(s){
    Object.keys(skips[s]).forEach(function(w){
      if(lo&&w<lo)lo=w; if(hi&&w>hi)hi=w;
    });
  });
  if(!lo){lo=hi=iso(monday(new Date()));}
  var out=[];
  for(var d=D(lo); iso(d)<=iso(addD(D(hi),28)); d=addD(d,7)) out.push(iso(d));
  return out;
}

/* Лента рисуется так же, как «все занятия» на сайте: в неделях-пропусках ячеек
   нет, их место занимает одна заштрихованная плашка на весь блок строк. */
function render(){
  var weeks=allWeeks(), N=weeks.length, cw=iso(monday(new Date()));
  var h='<div class="tl"><div class="tg" style="grid-template-columns:var(--tn) repeat('+
        N+',minmax(34px,1fr))">';
  h+='<div class="tn hd" style="grid-row:1 / span 2;grid-column:1"></div>';
  for(var i=0;i<N;){
    var m=D(weeks[i]).getUTCMonth(), j=i;
    while(j<N&&D(weeks[j]).getUTCMonth()===m)j++;
    h+='<div class="tmo'+(i?"":" first")+'" style="grid-row:1;grid-column:'+(i+2)+
       " / span "+(j-i)+'">'+MN[m]+"</div>";
    i=j;
  }
  weeks.forEach(function(w,wi){
    h+='<div class="twk'+(w===cw?" now":"")+'" style="grid-row:2;grid-column:'+(wi+2)+
       '"><span>'+D(w).getUTCDate()+"</span></div>";
  });

  var R=3;
  sections().forEach(function(sec){
    h+='<div class="tsec" style="grid-row:'+R+'"><span>'+
       esc(sec.streamName)+" · "+esc(sec.group)+"</span></div>";
    R++;
    var r0=R, n=sec.rows.length;
    for(i=0;i<N;){
      if(!skips[sec.stream][weeks[i]]){i++;continue;}
      var why=skips[sec.stream][weeks[i]], j2=i;
      while(j2<N&&skips[sec.stream][weeks[j2]]===why)j2++;
      var mine=selP&&selP.stream===sec.stream&&
               pauseRun(sec.stream,selP.from).from===pauseRun(sec.stream,weeks[i]).from;
      h+='<div class="tskip'+(j2-i>2?" wide":"")+(mine?" sel":"")+'" data-skip="'+
         esc(sec.stream)+"|"+weeks[i]+'" style="grid-row:'+r0+" / span "+n+
         ";grid-column:"+(i+2)+" / span "+(j2-i)+'"><span>'+esc(why)+"</span></div>";
      i=j2;
    }
    var last=null;
    sec.rows.forEach(function(c,ri){
      var k=subjRank(c), sep=ri>0&&k!==last; last=k;
      var occ={}, list=weeksOf(c);
      list.forEach(function(w,n2){occ[w]=n2+1;});
      h+='<div class="tn'+(sep?" sep":"")+(sel===c.key?" sel":"")+
         '" data-key="'+esc(c.key)+'" style="grid-row:'+R+';grid-column:1"><div class="nm">'+
         esc(c.name)+'</div><div class="mt">'+esc(slotLabel(c))+
         (c.teacher?" · "+esc(c.teacher):"")+"</div></div>";
      weeks.forEach(function(w,wi){
        if(skips[sec.stream][w])return;
        var cls="tcl"+(sep?" sep":"")+(w===cw?" now":"");
        var pos='style="grid-row:'+R+";grid-column:"+(wi+2)+'"';
        if(!occ[w]){h+='<div class="'+cls+'" '+pos+"></div>";return;}
        var prev=wi>0&&occ[weeks[wi-1]], next=wi<N-1&&occ[weeks[wi+1]];
        h+='<div class="'+cls+'" '+pos+'><div class="tbar'+(prev?"":" l")+(next?"":" r")+
           (sel===c.key?" sel":"")+(c.isNew?" new":"")+'" data-key="'+esc(c.key)+
           '" style="background:var(--c'+c.color+"b);color:var(--c"+c.color+'f)">'+occ[w]+
           (next?"":'<span class="grip" data-grip="1"></span>')+"</div></div>";
      });
      R++;
    });
  });
  document.getElementById("view").innerHTML=h+"</div></div>";
  document.getElementById("sub").textContent=data.subtitle||"";
  countChanges();
}
</script>
<script>
/* ---- правки ------------------------------------------------------------- */

function find(key){for(var i=0;i<courses.length;i++)if(courses[i].key===key)return courses[i];}

function diffOf(c){
  var out={};
  ["name","teacher","time","count","start"].forEach(function(f){
    if(String(c[f])!==String(c.was[f]))out[f]=c[f];
  });
  if(String(c.dur)!==String(c.was.dur))out.duration=c.dur;
  return out;
}

function skipDiff(){
  var out={};
  streams.forEach(function(st){
    var now=Object.keys(skips[st.id]).sort().map(function(w){
      return {date:w, reason:skips[st.id][w]};
    });
    var was=Object.keys(skipsWas[st.id]).sort().map(function(w){
      return {date:w, reason:skipsWas[st.id][w]};
    });
    if(JSON.stringify(now)!==JSON.stringify(was))out[st.id]=now;
  });
  return out;
}

function countChanges(){
  var changed=0,fresh=0;
  courses.forEach(function(c){
    if(c.isNew)fresh++;
    else if(Object.keys(diffOf(c)).length)changed++;
  });
  var pauses=Object.keys(skipDiff()).length;
  var say=[];
  if(changed)say.push("изменено: "+changed);
  if(fresh)say.push("новых: "+fresh);
  if(pauses)say.push("паузы: "+pauses+" пот.");
  document.getElementById("n").textContent=say.join(", ")||"правок нет";
  return changed+fresh+pauses;
}

function after(){ render(); panel(); if(!drag)focusRow(); }

function shift(c,dw){
  c.start=iso(addD(D(c.start),dw*7));
  after();
}
function resize(c,dn){
  var n=c.count+dn;
  if(n<1||n>60)return;
  c.count=n;
  after();
}

/* ---- панель ------------------------------------------------------------- */

function room(){
  var box=document.getElementById("panel");
  var open=box.className.indexOf("off")<0;
  document.querySelector(".wrap").style.paddingTop =
    (open ? box.getBoundingClientRect().height + 16 : 16) + "px";
}

/* Панель висит сверху и закрывает верх ленты, поэтому подводим выбранный ряд
   под неё: правишь курс и сразу его видишь. */
function focusRow(){
  room();
  var row=document.querySelector(".tn.sel")||document.querySelector(".tskip.sel");
  if(!row)return;
  var top=document.getElementById("panel").getBoundingClientRect().height+10;
  var r=row.getBoundingClientRect();
  if(r.top<top||r.bottom>window.innerHeight-70)
    window.scrollBy({top:r.top-top,behavior:"smooth"});
}

function show(cls,on){
  Array.prototype.forEach.call(document.querySelectorAll("."+cls),function(el){
    el.style.display=on?"":"none";
  });
}

function panel(){
  var box=document.getElementById("panel");
  if(selP){
    var p=pauseRun(selP.stream,selP.from);
    box.className="panel";
    show("courseonly",false); show("slotonly",false); show("pauseonly",true);
    document.getElementById("drop").className="off";
    document.getElementById("dropause").className="";
    document.getElementById("p-title").textContent="пауза";
    document.getElementById("p-where").textContent=
      (streams.filter(function(x){return x.id===p.stream;})[0]||{}).name||p.stream;
    document.getElementById("f-pstream").innerHTML=streams.map(function(st){
      return '<button data-pstream="'+esc(st.id)+'"'+(st.id===p.stream?' class="on"':"")+">"+
             esc(st.name)+"</button>";
    }).join("");
    document.getElementById("f-why").value=p.why;
    document.getElementById("f-plen").textContent=p.len;
    document.getElementById("f-pstart").textContent=fmt(D(p.from));
    room();
    return;
  }
  var c=sel&&find(sel);
  if(!c){box.className="panel off";room();return;}
  box.className="panel";
  show("pauseonly",false); show("courseonly",true);
  document.getElementById("dropause").className="off";
  document.getElementById("p-title").textContent=c.isNew?"новый курс":"курс";
  document.getElementById("p-where").textContent=c.streamName+" · "+c.group;
  document.getElementById("drop").className=c.isNew?"":"off";
  var np=nameParts(c.name), subs=subjectsKnown(), parts=partsKnown();
  var ownSub=subs.indexOf(np[0])>=0;
  document.getElementById("f-subj").innerHTML=subs.map(function(b){
    return '<button data-subj="'+esc(b)+'"'+(ownSub&&b===np[0]?' class="on"':"")+">"+esc(b)+"</button>";
  }).join("")+'<button data-subj="*"'+(ownSub?"":' class="on"')+">другое</button>";
  document.getElementById("f-part").innerHTML=
    '<button data-part=""'+(np[1]?"":' class="on"')+">—</button>"+parts.map(function(t){
      return '<button data-part="'+esc(t)+'"'+(t===np[1]?' class="on"':"")+">"+esc(t)+"</button>";
    }).join("");
  document.getElementById("f-name").className=ownSub?"off":"";
  document.getElementById("f-name").value=c.name;

  var tt=teachersKnown(), ownT=tt.indexOf(c.teacher)>=0;
  document.getElementById("f-teachers").innerHTML=tt.map(function(t){
    return '<button data-teacher="'+esc(t)+'"'+(t===c.teacher?' class="on"':"")+">"+esc(t)+"</button>";
  }).join("")+'<button data-teacher="*"'+(ownT?"":' class="on"')+">новый</button>";
  document.getElementById("f-teacher").className=ownT?"off":"";
  document.getElementById("f-teacher").value=c.teacher;
  document.getElementById("f-time").value=c.time;
  document.getElementById("f-dur").value=c.dur;
  document.getElementById("f-count").textContent=c.count;
  document.getElementById("f-start").textContent=fmt(D(c.start))+" "+WDS[wdIdx(D(c.start))];

  /* Ряд — поток, группа и день недели. Менять его можно только у курса, который
     ещё не отправлен: у заведённого это переезд, а бот его не умеет. */
  show("slotonly",c.isNew);
  if(c.isNew){
    /* Групп всего две, и набирать их руками незачем. Кнопка «другая» остаётся
       на случай, когда появляется группа, которой ещё не было. */
    var known=groupsKnown(), own=known.indexOf(c.group)>=0;
    document.getElementById("f-groups").innerHTML=known.map(function(g){
      return '<button data-group="'+esc(g)+'"'+(g===c.group?' class="on"':"")+">"+esc(g)+"</button>";
    }).join("")+'<button data-group="*"'+(own?"":' class="on"')+">другая</button>";
    document.getElementById("f-group").className=own?"off":"";
    document.getElementById("f-group").value=c.group;
    document.getElementById("f-stream").innerHTML=streams.map(function(st){
      return '<button data-stream="'+esc(st.id)+'"'+(st.id===c.stream?' class="on"':"")+">"+
             esc(st.name)+"</button>";
    }).join("");
    document.getElementById("f-wd").innerHTML=WDS.map(function(t,i){
      return '<button data-wd="'+i+'"'+(i===wdIdx(D(c.start))?' class="on"':"")+">"+t+"</button>";
    }).join("");
  }
  room();
}

/* Названия курсов устроены одинаково: предмет плюс приписка. Из тех, что уже
   есть, собираем оба списка — набирать руками нечего, а «другое» остаётся на
   случай, когда появляется что-то новое. */
function nameParts(name){
  var i=String(name).indexOf(" ");
  return i<0 ? [name,""] : [name.slice(0,i), name.slice(i+1)];
}
function subjectsKnown(){
  var seen={},out=[];
  courses.forEach(function(c){
    if(c.isNew)return;
    var b=nameParts(c.name)[0];
    if(!seen[b]){seen[b]=1;out.push(b);}
  });
  return out.sort();
}
function partsKnown(){
  var seen={},out=[];
  courses.forEach(function(c){
    if(c.isNew)return;
    var t=nameParts(c.name)[1];
    if(t&&!seen[t]){seen[t]=1;out.push(t);}
  });
  return out.sort();
}
function teachersKnown(){
  var seen={},out=[];
  courses.forEach(function(c){if(c.teacher&&!seen[c.teacher]){seen[c.teacher]=1;out.push(c.teacher);}});
  return out.sort();
}

function groupsKnown(){
  var seen={},out=[];
  courses.forEach(function(c){if(!c.isNew&&!seen[c.group]){seen[c.group]=1;out.push(c.group);}});
  return out.sort();
}



document.getElementById("f-why").addEventListener("input",function(){
  if(!selP)return;
  var p=pauseRun(selP.stream,selP.from);
  setPause(p,p.from,p.len,this.value||"нет занятий");
  render(); countChanges();
});

["f-name","f-teacher","f-time","f-dur","f-group"].forEach(function(id){
  document.getElementById(id).addEventListener("input",function(){
    var c=sel&&find(sel); if(!c)return;
    if(id==="f-name")c.name=this.value;
    if(id==="f-teacher")c.teacher=this.value;
    if(id==="f-time")c.time=this.value;
    if(id==="f-dur")c.dur=this.value;
    if(id==="f-group"&&c.isNew){
      c.group=this.value;
      /* панель целиком не перерисовываем: это сбросило бы фокус из поля */
      document.getElementById("p-where").textContent=c.streamName+" \u00b7 "+c.group;
    }
    if(id==="f-name"||id==="f-teacher"||id==="f-time"||id==="f-group"){render();}
    countChanges();
  });
});

document.getElementById("panel").addEventListener("click",function(ev){
  if(selP){
    var p=pauseRun(selP.stream,selP.from);
    var pn=ev.target.getAttribute("data-pn"), pwk=ev.target.getAttribute("data-pw");
    if(pn){
      var len=Math.max(1,Math.min(12,p.len+ +pn));
      setPause(p,p.from,len,p.why); after();
    }
    if(pwk){setPause(p,iso(addD(D(p.from),+pwk*7)),p.len,p.why); after();}
    var pst=ev.target.getAttribute("data-pstream");
    if(pst&&pst!==p.stream){
      /* Пауза переезжает в другой поток теми же неделями: снимаем со старого,
         ставим на новый. Занятия обоих потоков пересчитает бот. */
      for(var i=0;i<p.len;i++)delete skips[p.stream][iso(addD(D(p.from),i*7))];
      for(i=0;i<p.len;i++)skips[pst][iso(addD(D(p.from),i*7))]=p.why;
      selP={stream:pst, from:p.from};
      after();
    }
    return;
  }
  var c=sel&&find(sel); if(!c)return;
  var n=ev.target.getAttribute("data-n"), w=ev.target.getAttribute("data-w");
  var st=ev.target.getAttribute("data-stream"), wd=ev.target.getAttribute("data-wd");
  var sub=ev.target.getAttribute("data-subj"), part=ev.target.getAttribute("data-part");
  var tch=ev.target.getAttribute("data-teacher");
  if(sub!==null&&sub!==undefined){
    if(sub==="*"){
      document.getElementById("f-name").className="";
      document.getElementById("f-name").focus();
      document.getElementById("f-name").select();
    }else{
      c.name=(sub+" "+nameParts(c.name)[1]).trim();
      after();
    }
    return;
  }
  if(part!==null&&part!==undefined){
    c.name=(nameParts(c.name)[0]+" "+part).trim();
    after();
    return;
  }
  if(tch!==null&&tch!==undefined){
    if(tch==="*"){
      document.getElementById("f-teacher").className="";
      document.getElementById("f-teacher").focus();
      document.getElementById("f-teacher").select();
    }else{c.teacher=tch;after();}
    return;
  }
  var gr=ev.target.getAttribute("data-group");
  if(gr&&c.isNew){
    if(gr==="*"){
      document.getElementById("f-group").className="";
      document.getElementById("f-group").focus();
      document.getElementById("f-group").select();
    }else{c.group=gr;after();}
    return;
  }
  if(n)resize(c,+n);
  if(w)shift(c,+w);
  if(st&&c.isNew){
    var stream=streams.filter(function(x){return x.id===st;})[0];
    c.stream=st; c.streamName=stream?stream.name:st; after();
  }
  if(wd!==null&&wd!==undefined&&c.isNew){
    c.start=iso(addD(monday(D(c.start)),+wd)); after();
  }
});
document.getElementById("close").addEventListener("click",function(){
  sel=null; selP=null; render(); panel();
});

/* Пауза ставится на текущую неделю первого потока, дальше правится в панели:
   отдельного выбора «куда» не нужно, его видно и меняется там же. */
document.getElementById("addpause").addEventListener("click",function(){
  var st=(selP&&selP.stream)||(sel&&find(sel)&&find(sel).stream)||(streams[0]||{}).id;
  if(!st)return;
  var w=iso(monday(new Date()));
  if(!skips[st][w])skips[st][w]="нет занятий";
  sel=null; selP={stream:st, from:w};
  after();
  document.getElementById("f-why").focus();
  document.getElementById("f-why").select();
});

document.getElementById("dropause").addEventListener("click",function(){
  if(!selP)return;
  var p=pauseRun(selP.stream,selP.from);
  for(var i=0;i<p.len;i++)delete skips[p.stream][iso(addD(D(p.from),i*7))];
  selP=null; after();
});

/* ---- выбор и перетаскивание --------------------------------------------- */

function colWidth(){
  var cell=document.querySelector(".twk");
  return cell?cell.getBoundingClientRect().width:34;
}

document.getElementById("view").addEventListener("pointerdown",function(ev){
  var pause=ev.target.closest?ev.target.closest("[data-skip]"):null;
  if(pause){
    var parts=pause.getAttribute("data-skip").split("|");
    sel=null; selP={stream:parts[0], from:pauseRun(parts[0],parts[1]).from};
    render(); panel(); focusRow();
    return;
  }
  var el=ev.target.closest?ev.target.closest("[data-key]"):null;
  if(!el)return;
  selP=null;
  var c=find(el.getAttribute("data-key")); if(!c)return;
  var was=sel; sel=c.key; render(); panel();
  if(was!==sel)focusRow();
  if(el.className.indexOf("tbar")<0)return;          /* по названию только выбираем */
  drag={c:c, x0:ev.clientX, w:colWidth(),
        grip:!!(ev.target.getAttribute&&ev.target.getAttribute("data-grip")),
        start0:c.start, count0:c.count};
  ev.preventDefault();
});
window.addEventListener("pointermove",function(ev){
  if(!drag)return;
  var dw=Math.round((ev.clientX-drag.x0)/drag.w);
  if(drag.grip){
    var n=Math.max(1,Math.min(60,drag.count0+dw));
    if(n!==drag.c.count){drag.c.count=n;after();}
  }else{
    var want=iso(addD(D(drag.start0),dw*7));
    if(want!==drag.c.start){drag.c.start=want;after();}
  }
});
window.addEventListener("pointerup",function(){drag=null;});

/* ---- заведение ---------------------------------------------------------- */

function fresh(base){
  var c={key:"new:"+(++newN), isNew:true, color:6, dur:"", count:1};
  for(var k in base)c[k]=base[k];
  c.was={name:c.name,teacher:c.teacher,time:c.time,dur:c.dur,count:c.count,start:c.start};
  courses.push(c);
  sel=c.key;
  after();
  return c;
}

/* Новый курс встаёт в ряд выбранного — поток, группа и день берутся у него, а
   начало ставится на неделю после его конца: чаще всего это и есть продолжение,
   вторая часть. Ничего не выбрано — берём первый поток и первую неделю, а ряд
   меняется в панели. Отдельная кнопка «+ ряд» для этого не нужна. */
document.getElementById("add").addEventListener("click",function(){
  document.getElementById("err").textContent="";
  var base=sel&&find(sel);
  if(base){
    var occ=weeksOf(base), last=occ.length?D(occ[occ.length-1]):monday(D(base.start));
    fresh({stream:base.stream, streamName:base.streamName, group:base.group,
           name:"Новый курс", teacher:base.teacher, time:base.time, dur:base.dur,
           start:iso(addD(last,7+wdIdx(D(base.start))))});
  }else{
    var st=streams[0]; if(!st)return;
    fresh({stream:st.id, streamName:st.name, group:"10-11", name:"Новый курс",
           teacher:"", time:"", start:allWeeks()[0]});
    window.scrollTo({top:0,behavior:"smooth"});
  }
  document.getElementById("f-name").focus();
  document.getElementById("f-name").select();
});

document.getElementById("drop").addEventListener("click",function(){
  var c=sel&&find(sel); if(!c||!c.isNew)return;
  courses=courses.filter(function(x){return x.key!==c.key;});
  sel=null; after();
});

/* ---- отправка ----------------------------------------------------------- */

function payload(){
  var edit=[],add=[];
  courses.forEach(function(c){
    if(c.isNew){
      var one={stream:c.stream,group:c.group,name:c.name,start:c.start,count:c.count};
      if(c.teacher)one.teacher=c.teacher;
      if(c.time)one.time=c.time;
      if(c.dur)one.duration=c.dur;
      add.push(one);
      return;
    }
    var d=diffOf(c);
    if(Object.keys(d).length){d.id=c.key;edit.push(d);}
  });
  return {v:1, edit:edit, add:add, skips:skipDiff()};
}

document.getElementById("send").addEventListener("click",function(){
  var err=document.getElementById("err");
  if(!countChanges()){err.textContent="Нечего отправлять: правок нет.";return;}
  var bad=courses.filter(function(c){return c.isNew&&(!c.name||c.name==="Новый курс");});
  if(bad.length){err.textContent="У нового курса не задано название.";return;}
  var body=JSON.stringify(payload());
  if(body.length>4000){err.textContent="Слишком много правок за раз, отправьте частями.";return;}
  err.textContent="";
  if(tg)tg.sendData(body); else alert(body);
});

document.getElementById("reset").addEventListener("click",function(){
  skips=JSON.parse(JSON.stringify(skipsWas));
  selP=null;
  courses=courses.filter(function(c){return !c.isNew;});
  courses.forEach(function(c){
    c.name=c.was.name;c.teacher=c.was.teacher;c.time=c.was.time;
    c.dur=c.was.dur;c.count=c.was.count;c.start=c.was.start;
  });
  sel=null; after();
  document.getElementById("err").textContent="";
});

/* ---- старт -------------------------------------------------------------- */

if(data&&data.streams&&data.streams.length){ load(); render(); }
else document.getElementById("sub").textContent="Не удалось прочитать schedule.js.";
</script>
