<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лента сезона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Палитра та же, что на сайте: курс должен узнаваться по цвету. */
:root{
  --bg:#ffffff;--fg:#1b1b1a;--fg2:#6b6b66;--fg3:#96968f;
  --line:#e4e4de;--line2:#c8c8c0;--panel:#f1f1ec;--skip:#eeeeea;--accent:#2b6cb0;
  --sh:0 1px 2px rgba(0,0,0,.08);
  --c1b:#c9daf8;--c1m:#a4c2f4;
  --c2b:#d9ead3;--c2m:#b6d7a8;
  --c3b:#f4cccc;--c3m:#ea9999;
  --c4b:#d9d2e9;--c4m:#b4a7d6;
  --c5b:#ead1dc;--c5m:#d5a6bd;
  --c6b:#f1f1ec;--c6m:#e4e4de;
  --col:34px;--lab:92px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1a18;--fg:#eceae6;--fg2:#a2a29a;--fg3:#78786f;
  --line:#32322e;--line2:#4a4a44;--panel:#232320;--skip:#2a2a27;--accent:#7aa7d9;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --c1b:#12233f;--c1m:#a4c2f4;
  --c2b:#25331e;--c2m:#b6d7a8;
  --c3b:#3c1616;--c3m:#ea9999;
  --c4b:#241e33;--c4m:#b4a7d6;
  --c5b:#331f29;--c5m:#d5a6bd;
  --c6b:#2c2c26;--c6m:#e4e4de;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 72px}
h1{font-size:19px;font-weight:600;margin:0 0 2px}
.sub{color:var(--fg2);font-size:13px;margin:0 0 6px}
.hint{font-size:11px;color:var(--fg3);margin:0 0 12px}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.grid{display:grid;align-items:center;min-width:max-content}
.hd{position:sticky;top:0;z-index:3;background:var(--bg);font-size:12px;color:var(--fg2);
    text-align:center;padding:8px 0 7px;border-bottom:1px solid var(--line);font-weight:600}
.hd.mon{color:var(--fg3);font-weight:400;font-size:10px;text-transform:uppercase;
        letter-spacing:.04em}
.lab{position:sticky;left:0;z-index:2;background:var(--bg);padding:6px 10px;
     border-right:1px solid var(--line);white-space:nowrap}
.lab b{display:block;font-size:14px;font-weight:600}
.lab span{color:var(--fg3);font-size:11px}
.grp{grid-column:1/-1;background:var(--panel);font-size:11px;font-weight:600;color:var(--fg2);
     padding:6px 10px;position:sticky;left:0;text-transform:uppercase;letter-spacing:.04em;
     border-bottom:1px solid var(--line)}
.slot{height:44px;border-bottom:1px solid var(--line);position:relative}
.wk{border-right:1px solid var(--line)}
.wk.skip{background:var(--skip)}
.wk:last-child{border-right:0}
/* Полоса выглядит как карточка занятия на сайте: скруглённая, пастельная,
   с цветной чертой слева. */
.bar{position:absolute;top:5px;height:34px;border-radius:8px;display:flex;align-items:center;
     padding:0 8px;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;
     cursor:grab;touch-action:none;box-shadow:var(--sh)}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
             border-radius:8px 0 0 8px;background:var(--mid)}
.bar.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.bar .grip{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:ew-resize;
           border-radius:0 8px 8px 0;background:linear-gradient(90deg,transparent,var(--mid))}
.bar.new{border:1px dashed var(--line2)}
/* Панель всплывает сверху: после тычка по полосе глаз там, а не внизу
   страницы, и лента под ней остаётся видна — правишь и сразу смотришь. */
.panel{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px 14px 10px;
       background:var(--panel);border-bottom:1px solid var(--line2);
       box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:72vh;overflow:auto}
.panel.off{display:none}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;
     padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg2);font-size:13px;padding:4px 9px;
            border-radius:7px}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:var(--sh)}
.phd{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.phd b{font-size:15px}
.phd span{color:var(--fg2);font-size:12px}
.phd button{margin-left:auto}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row label{width:96px;color:var(--fg2);font-size:12px;flex:none}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line2);
      border-radius:8px;padding:7px 9px;font-family:inherit;font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;font-size:16px}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:8px;
       padding:6px 11px;font-family:inherit;font-size:13px;cursor:pointer;
       -webkit-user-select:none;user-select:none}
button.main{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
button:active{box-shadow:var(--sh)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.off{display:none}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;
     padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg2);font-size:13px;padding:4px 9px;
            border-radius:7px}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:var(--sh)}
.bar.new{border-style:dashed}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);
      border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:6px;align-items:center}
.foot .n{color:var(--fg2);font-size:12px;flex:1;min-width:0;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
.foot button{white-space:nowrap;padding:7px 9px}
.scroll{padding-bottom:64px}
.err{color:#8c2b2b;font-size:12px;margin:6px 16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Лента сезона</h1>
  <p class="sub" id="sub">загрузка…</p>
  <p class="hint">Потяните полосу — сдвинется начало. Потяните правый край — изменится длина.</p>
  <div class="box"><div class="scroll"><div class="grid" id="grid"></div></div></div>
</div>

<div class="panel off" id="panel">
  <div class="phd"><b id="p-title">курс</b><span id="p-where"></span>
    <button id="close">Свернуть</button></div>
  <div class="row slotonly"><label>поток</label><span class="seg" id="f-stream"></span></div>
  <div class="row slotonly"><label>группа</label><input id="f-group" placeholder="10-11"></div>
  <div class="row slotonly"><label>день</label><span class="seg" id="f-wd"></span></div>
  <div class="row"><label>курс</label><input id="f-name"></div>
  <div class="row"><label>преподаватель</label><input id="f-teacher" list="teachers"></div>
  <datalist id="teachers"></datalist>
  <div class="row"><label>время</label><input id="f-time" placeholder="18:00" inputmode="numeric"></div>
  <div class="row"><label>минут</label><input id="f-dur" placeholder="90" inputmode="numeric"></div>
  <div class="row"><label>занятий</label>
    <span class="step"><button data-n="-1">−</button><b id="f-count">0</b><button data-n="1">+</button></span>
  </div>
  <div class="row"><label>начало</label>
    <span class="step"><button data-w="-1">◀</button><b id="f-start">—</b><button data-w="1">▶</button></span>
  </div>
  <div class="acts"><button id="drop" class="off">Убрать курс</button></div>
</div>

<div class="err" id="err"></div>

<div class="foot">
  <span class="n" id="n">правок нет</span>
  <button id="add">+ курс</button>
  <button id="addrow">+ ряд</button>
  <button id="reset">Сброс</button>
  <button class="main" id="send">Отправить</button>
</div>

<script src="schedule.js"></script>
<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ---- данные ------------------------------------------------------------- */

function D(s){var p=String(s).split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function iso(d){return d.toISOString().slice(0,10);}
function addD(d,n){return new Date(d.getTime()+n*86400000);}
function monday(d){var w=(d.getUTCDay()+6)%7;return addD(d,-w);}
function fmt(d){return ("0"+d.getUTCDate()).slice(-2)+"."+("0"+(d.getUTCMonth()+1)).slice(-2);}
var WD=["пн","вт","ср","чт","пт","сб","вс"];
/* ширина недельной колонки: та же, что в CSS, --col */
var COL=34;
var MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

var data = typeof SCHEDULE !== "undefined" ? SCHEDULE : null;
var courses = [], weeks = [], skips = {}, sel = null, newN = 0, drag = null;

function build(){
  courses = [];
  (data.streams||[]).forEach(function(st){
    skips[st.id] = {};
    (st.skips||[]).forEach(function(s){ skips[st.id][iso(monday(D(s.date)))] = s.reason || "пропуск"; });
    (st.series||[]).forEach(function(s){
      courses.push({
        key:s.id, stream:st.id, streamName:st.name||st.id, group:s.group,
        name:s.name, teacher:s.teacher||"", time:s.time||"", dur:s.duration||"",
        count:s.count, start:s.start, color:s.color||6,
        was:{name:s.name, teacher:s.teacher||"", time:s.time||"", dur:s.duration||"",
             count:s.count, start:s.start}
      });
    });
  });

  /* Недели сезона: от самого раннего начала до самого позднего конца, с запасом
     в месяц вперёд — курс должно быть куда продлить. */
  var lo=null, hi=null;
  courses.forEach(function(c){
    var m=monday(D(c.start));
    if(!lo||m<lo)lo=m;
    var end=weeksOf(c); end=end.length?end[end.length-1]:m;
    if(!hi||end>hi)hi=end;
  });
  if(!lo){lo=monday(new Date());hi=lo;}
  hi=addD(hi,28);
  weeks=[];
  for(var w=new Date(lo); w<=hi; w=addD(w,7)) weeks.push(new Date(w));
}

/* Недели, которые курс занимает: шаг в неделю, пропущенные недели потока
   перескакиваем. То же правило у бота (lessons.planned_dates) и на сайте
   (occurrences) — здесь оно выражено через колонки. */
function weeksOf(c){
  var out=[], w=monday(D(c.start)), guard=0;
  while(out.length<c.count && guard++<200){
    if(!skips[c.stream][iso(w)]) out.push(new Date(w));
    w=addD(w,7);
  }
  return out;
}

function slotsOf(){
  var keys=[], byKey={};
  courses.forEach(function(c){
    var wd=(D(c.start).getUTCDay()+6)%7;
    var k=c.stream+"|"+c.group+"|"+wd;
    if(!byKey[k]){byKey[k]={stream:c.stream,streamName:c.streamName,group:c.group,wd:wd,list:[]};
                  keys.push(k);}
    byKey[k].list.push(c);
  });
  keys.sort(function(a,b){
    var x=byKey[a],y=byKey[b];
    return x.streamName.localeCompare(y.streamName)||x.group.localeCompare(y.group)||x.wd-y.wd;
  });
  return keys.map(function(k){return byKey[k];});
}

/* ---- отрисовка ---------------------------------------------------------- */

function render(){
  var grid=document.getElementById("grid");
  grid.style.gridTemplateColumns="var(--lab) repeat("+weeks.length+",var(--col))";
  grid.innerHTML="";

  grid.appendChild(cell("hd lab","неделя"));
  weeks.forEach(function(w,i){
    var first = i===0 || w.getUTCMonth()!==weeks[i-1].getUTCMonth();
    grid.appendChild(cell("hd"+(first?" mon":""), first?MON[w.getUTCMonth()]:fmt(w).slice(0,2)));
  });

  var lastStream=null;
  slotsOf().forEach(function(slot){
    if(slot.streamName!==lastStream){
      lastStream=slot.streamName;
      grid.appendChild(cell("grp",slot.streamName));
    }
    var lab=cell("lab","");
    lab.innerHTML="<b>"+esc(slot.group)+"</b><span>"+WD[slot.wd]+"</span>";
    grid.appendChild(lab);

    var track=document.createElement("div");
    track.className="slot";
    track.style.gridColumn="2 / -1";
    weeks.forEach(function(w){
      var c=document.createElement("div");
      c.className="wk"+(skips[slot.stream][iso(w)]?" skip":"");
      c.style.cssText+="position:absolute;top:0;bottom:0;left:"+(idx(w)*COL)+"px;width:"+COL+"px";
      track.appendChild(c);
    });
    slot.list.forEach(function(c){ bars(track,c); });
    grid.appendChild(track);
  });

  document.getElementById("sub").textContent =
    data.subtitle ? data.subtitle : (courses.length+" курсов");
  fillTeachers();
  countChanges();
}

function idx(w){var t=iso(w);for(var i=0;i<weeks.length;i++)if(iso(weeks[i])===t)return i;return -1;}
function cell(cls,text){var d=document.createElement("div");d.className=cls;d.textContent=text;return d;}
function esc(s){return String(s).replace(/[&<>]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}

/* Курс рисуется не одним блоком, а полосами по занятым неделям: пропущенная
   неделя видна дырой, и это честнее, чем сплошная полоса поверх неё. */
function bars(track,c){
  var occ=weeksOf(c).map(idx).filter(function(i){return i>=0;});
  if(!occ.length)return;
  var runs=[],cur=[occ[0]];
  for(var i=1;i<occ.length;i++){
    if(occ[i]===occ[i-1]+1)cur.push(occ[i]);else{runs.push(cur);cur=[occ[i]];}
  }
  runs.push(cur);
  runs.forEach(function(run,n){
    var b=document.createElement("div");
    b.className="bar"+(sel===c.key?" sel":"")+(c.isNew?" new":"");
    b.style.left=(run[0]*COL+2)+"px";
    b.style.width=(run.length*COL-4)+"px";
    b.style.background="var(--c"+c.color+"b)";
    b.style.setProperty("--mid","var(--c"+c.color+"m)");
    b.textContent=n===0?c.name:"";
    b.dataset.key=c.key;
    if(n===runs.length-1){
      var g=document.createElement("div");g.className="grip";g.dataset.grip="1";
      b.appendChild(g);
    }
    track.appendChild(b);
  });
}

/* ---- правки ------------------------------------------------------------- */

function find(key){for(var i=0;i<courses.length;i++)if(courses[i].key===key)return courses[i];}

function diffOf(c){
  var out={};
  ["name","teacher","time","count","start"].forEach(function(f){
    if(String(c[f])!==String(c.was[f]))out[f]=c[f];
  });
  if(String(c.dur)!==String(c.was.dur))out.duration=c.dur;
  return out;
}

function countChanges(){
  var n=0,fresh=0;
  courses.forEach(function(c){
    if(c.isNew)fresh++;
    else if(Object.keys(diffOf(c)).length)n++;
  });
  var say=[];
  if(n)say.push("изменено: "+n);
  if(fresh)say.push("новых: "+fresh);
  document.getElementById("n").textContent=say.join(", ")||"правок нет";
  return n+fresh;
}

function shift(c,dw){
  var w=addD(monday(D(c.start)),dw*7);
  if(idx(w)<0)return;
  c.start=iso(addD(w,(D(c.start).getUTCDay()+6)%7));
  after();
}

function resize(c,dn){
  var n=c.count+dn;
  if(n<1||n>60)return;
  c.count=n;
  after();
}

/* Во время перетаскивания ленту не подводим: она дралась бы с пальцем. */
function after(){ build2(); render(); panel(); if(!drag)focusBar(); }

/* Пересобираем только границы недель: курсы уже в памяти, заново их читать
   из schedule.js нельзя — потеряются правки. */
function build2(){
  var lo=null,hi=null;
  courses.forEach(function(c){
    var m=monday(D(c.start)); if(!lo||m<lo)lo=m;
    var o=weeksOf(c); var e=o.length?o[o.length-1]:m; if(!hi||e>hi)hi=e;
  });
  hi=addD(hi,28);
  weeks=[];
  for(var w=new Date(lo);w<=hi;w=addD(w,7))weeks.push(new Date(w));
}

/* ---- панель ------------------------------------------------------------- */

function panel(){
  var box=document.getElementById("panel"),c=sel&&find(sel);
  if(!c){box.className="panel off";room();return;}
  box.className="panel";
  document.getElementById("p-title").textContent=c.isNew?"новый курс":"курс";
  document.getElementById("p-where").textContent =
    c.streamName+" · "+c.group+" · "+WD[(D(c.start).getUTCDay()+6)%7];
  document.getElementById("drop").className=c.isNew?"":"off";
  // Ряд — это поток, группа и день недели. Менять его можно только у курса,
  // который ещё не отправлен: у заведённого это переезд, а его бот не умеет.
  Array.prototype.forEach.call(document.querySelectorAll(".slotonly"),function(el){
    el.style.display=c.isNew?"":"none";
  });
  if(c.isNew){
    document.getElementById("f-group").value=c.group;
    document.getElementById("f-stream").innerHTML=(data.streams||[]).map(function(st){
      return '<button data-stream="'+esc(st.id)+'"'+(st.id===c.stream?' class="on"':"")+">"+
             esc(st.name||st.id)+"</button>";
    }).join("");
    var wd=(D(c.start).getUTCDay()+6)%7;
    document.getElementById("f-wd").innerHTML=WD.map(function(t,i){
      return '<button data-wd="'+i+'"'+(i===wd?' class="on"':"")+">"+t+"</button>";
    }).join("");
  }
  room();
  document.getElementById("f-name").value=c.name;
  document.getElementById("f-teacher").value=c.teacher;
  document.getElementById("f-time").value=c.time;
  document.getElementById("f-dur").value=c.dur;
  document.getElementById("f-count").textContent=c.count;
  document.getElementById("f-start").textContent=fmt(D(c.start))+" "+WD[(D(c.start).getUTCDay()+6)%7];
}

/* Панель висит сверху и закрывает верх ленты. Освобождаем под неё место:
   прокруткой полосу из первого ряда под панель не увести — страница и так
   наверху, опускать её некуда. */
function room(){
  var box=document.getElementById("panel");
  var open=box.className.indexOf("off")<0;
  document.querySelector(".wrap").style.paddingTop =
    (open ? box.getBoundingClientRect().height + 16 : 16) + "px";
}

/* После выбора подводим полосу под панель: правишь курс и сразу его видишь. */
function focusBar(){
  room();
  var bar=document.querySelector(".bar.sel");
  if(!bar)return;
  var box=document.getElementById("panel").getBoundingClientRect();
  var top=(box.height||0)+10;
  var r=bar.getBoundingClientRect();
  if(r.top<top||r.bottom>window.innerHeight-70)
    window.scrollBy({top:r.top-top,behavior:"smooth"});
  var scroll=document.querySelector(".scroll");
  var left=bar.offsetLeft-scroll.clientWidth/2+bar.offsetWidth/2;
  scroll.scrollTo({left:Math.max(0,left),behavior:"smooth"});
}

function fillTeachers(){
  var seen={},out=[];
  courses.forEach(function(c){if(c.teacher&&!seen[c.teacher]){seen[c.teacher]=1;out.push(c.teacher);}});
  document.getElementById("teachers").innerHTML =
    out.sort().map(function(t){return '<option value="'+esc(t)+'">';}).join("");
}

["f-name","f-teacher","f-time","f-dur","f-group"].forEach(function(id){
  document.getElementById(id).addEventListener("input",function(){
    var c=sel&&find(sel); if(!c)return;
    if(id==="f-name")c.name=this.value;
    if(id==="f-teacher")c.teacher=this.value;
    if(id==="f-time")c.time=this.value;
    if(id==="f-dur")c.dur=this.value;
    if(id==="f-group"&&c.isNew){c.group=this.value;render();focusBar();}
    countChanges();
  });
});

document.getElementById("panel").addEventListener("click",function(ev){
  var c=sel&&find(sel); if(!c)return;
  var n=ev.target.getAttribute("data-n"), w=ev.target.getAttribute("data-w");
  var st=ev.target.getAttribute("data-stream"), wd=ev.target.getAttribute("data-wd");
  if(n)resize(c,+n);
  if(w)shift(c,+w);
  if(st&&c.isNew){
    var stream=(data.streams||[]).filter(function(x){return x.id===st;})[0];
    c.stream=st;c.streamName=stream?(stream.name||st):st;after();
  }
  if(wd!==null&&wd!==undefined&&c.isNew){
    c.start=iso(addD(monday(D(c.start)),+wd));   /* тот же недельный столбец, другой день */
    after();
  }
});
document.getElementById("close").addEventListener("click",function(){sel=null;render();panel();});

/* Новый курс заводится в ряду выбранного — «поток, группа, день недели» берутся
   у него же — и встаёт на неделю после его конца: чаще всего это и есть
   продолжение, вторая часть курса. Слот руками выбирать не надо. */
document.getElementById("add").addEventListener("click",function(){
  var base=sel&&find(sel);
  if(!base){
    document.getElementById("err").textContent =
      "Сначала выберите полосу того ряда, куда добавить курс. Новый ряд — кнопка «+ ряд».";
    return;
  }
  document.getElementById("err").textContent="";
  var occ=weeksOf(base), last=occ.length?occ[occ.length-1]:monday(D(base.start));
  var startMon=addD(last,7);
  var fresh={
    key:"new:"+(++newN), isNew:true, stream:base.stream, streamName:base.streamName,
    group:base.group, name:"Новый курс", teacher:base.teacher, time:base.time,
    dur:base.dur, count:1, color:6,
    start:iso(addD(startMon,(D(base.start).getUTCDay()+6)%7))
  };
  fresh.was={name:fresh.name,teacher:fresh.teacher,time:fresh.time,
             dur:fresh.dur,count:fresh.count,start:fresh.start};
  courses.push(fresh);
  sel=fresh.key;
  after();
  document.getElementById("f-name").focus();
  document.getElementById("f-name").select();
});

/* Ряд с нуля: поток, группа и день выбираются в панели. Нужен, когда появляется
   группа или день недели, которых в расписании ещё не было, — иначе новый курс
   некуда положить: «+ курс в этот ряд» берёт слот у соседа. */
document.getElementById("addrow").addEventListener("click",function(){
  var st=(data.streams||[])[0]; if(!st)return;
  var first=weeks.length?weeks[0]:monday(new Date());
  var fresh={
    key:"new:"+(++newN), isNew:true, stream:st.id, streamName:st.name||st.id,
    group:"10-11", name:"Новый курс", teacher:"", time:"", dur:"", count:1, color:6,
    start:iso(first)
  };
  fresh.was={name:fresh.name,teacher:fresh.teacher,time:fresh.time,
             dur:fresh.dur,count:fresh.count,start:fresh.start};
  courses.push(fresh);
  sel=fresh.key;
  after();
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("f-group").focus();
});

document.getElementById("drop").addEventListener("click",function(){
  var c=sel&&find(sel); if(!c||!c.isNew)return;
  courses=courses.filter(function(x){return x.key!==c.key;});
  sel=null;after();
});

/* ---- перетаскивание ----------------------------------------------------- */

document.getElementById("grid").addEventListener("pointerdown",function(ev){
  var bar=ev.target.closest ? ev.target.closest(".bar") : null;
  if(!bar)return;
  var c=find(bar.dataset.key); if(!c)return;
  var was=sel; sel=c.key; render(); panel();
  if(was!==sel)focusBar();
  drag={c:c, x0:ev.clientX, grip:!!ev.target.getAttribute("data-grip"),
        start0:c.start, count0:c.count};
  ev.preventDefault();
});
window.addEventListener("pointermove",function(ev){
  if(!drag)return;
  var dw=Math.round((ev.clientX-drag.x0)/COL);
  if(drag.grip){
    var n=Math.max(1,Math.min(60,drag.count0+dw));
    if(n!==drag.c.count){drag.c.count=n;after();}
  }else if(dw!==0){
    var w=addD(monday(D(drag.start0)),dw*7);
    if(idx(w)>=0){
      var want=iso(addD(w,(D(drag.start0).getUTCDay()+6)%7));
      if(want!==drag.c.start){drag.c.start=want;after();}
    }
  }
});
window.addEventListener("pointerup",function(){drag=null;});

/* ---- отправка ----------------------------------------------------------- */

function payload(){
  var edit=[],add=[];
  courses.forEach(function(c){
    if(c.isNew){
      var one={stream:c.stream,group:c.group,name:c.name,start:c.start,count:c.count};
      if(c.teacher)one.teacher=c.teacher;
      if(c.time)one.time=c.time;
      if(c.dur)one.duration=c.dur;
      add.push(one);
      return;
    }
    var d=diffOf(c);
    if(Object.keys(d).length){d.id=c.key;edit.push(d);}
  });
  return {v:1, edit:edit, add:add};
}

document.getElementById("send").addEventListener("click",function(){
  var err=document.getElementById("err");
  if(!countChanges()){err.textContent="Нечего отправлять: правок нет.";return;}
  var bad=courses.filter(function(c){return c.isNew&&(!c.name||c.name==="Новый курс");});
  if(bad.length){err.textContent="У нового курса не задано название.";return;}
  var body=JSON.stringify(payload());
  if(body.length>4000){err.textContent="Слишком много правок за раз, отправьте частями.";return;}
  err.textContent="";
  if(tg){tg.sendData(body);}
  else{alert(body);}   /* в обычном браузере просто показываем, что ушло бы */
});

document.getElementById("reset").addEventListener("click",function(){
  courses=courses.filter(function(c){return !c.isNew;});
  courses.forEach(function(c){
    c.name=c.was.name;c.teacher=c.was.teacher;c.time=c.was.time;
    c.dur=c.was.dur;c.count=c.was.count;c.start=c.was.start;
  });
  sel=null;build2();render();panel();
  document.getElementById("err").textContent="";
});

/* ---- старт -------------------------------------------------------------- */

if(data && data.streams && data.streams.length){
  build();render();
}else{
  document.getElementById("sub").textContent="Не удалось прочитать schedule.js.";
}
</script>
</body>
</html>
