# Пустой обработчик сигнала «бот жив».
#
# Бот раз в четверть часа шлёт сюда событие repository_dispatch — но только если
# телеграм ему отвечает. Работы у этого workflow нет: важен сам факт запуска,
# а время запуска GitHub хранит за нас. По нему сторож и понимает, жив ли бот.
#
# Сигнал не кладётся в репозиторий файлом намеренно: тогда каждые пятнадцать
# минут появлялся бы коммит, и история превратилась бы в ленту тиканья.
name: heartbeat

on:
  repository_dispatch:
    types: [heartbeat]

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - run: echo "сигнал получен"
