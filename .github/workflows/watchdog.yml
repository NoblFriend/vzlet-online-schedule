# Сторож бота расписания.
#
# Бот не может сообщить о собственной смерти: если он лежит, он и молчит.
# Поэтому сторож живёт здесь, снаружи: раз в полчаса смотрит, когда от бота
# приходил последний сигнал, и поднимает тревогу, если сигнал пропал.
#
# Тревога уходит в телеграм отдельному боту-сторожу — не тому, за которым
# следим: если тот лежит, он и тревогу не отправит. Токен сторожа лежит в
# секретах репозитория; он ничем не управляет и никуда не вхож, поэтому его
# утечка стоит дёшево — в отличие от токена основного бота, который не
# покидает сервера.
#
# Пока секрет не задан, тревога заводит issue: сторож не должен молчать из-за
# того, что его ещё не донастроили.
#
# Тревога повторяется на каждой проверке, пока бот молчит. Это сделано
# намеренно: запоминать, что уже сообщали, негде, а тревога и должна надоедать,
# пока её не устранили.
#
# Когда бот оживает, приходит отбой — иначе непонятно, починилось само или ещё
# нет. Памяти о том, что тревога была, у сторожа нет, и заводить её негде;
# поэтому факт «бот только что вернулся» он вычитывает из тех же биений: ищет
# в их череде пропуск длиннее порога и смотрит, закончился ли этот пропуск
# позже прошлой проверки. Если позже — значит бот вернулся на наших глазах, и
# отбой уходит ровно один раз.
#
# Расписание GitHub соблюдает нестрого, запуск может опоздать на четверть часа.
# Поэтому порог сделан с запасом: тревога поднимается, только если сигнала нет
# заметно дольше, чем длится обычная задержка.
name: watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      limit_min:
        description: "Через сколько минут тишины поднимать тревогу (для проверки)"
        required: false
        default: "45"
      gap_min:
        description: "Какой пропуск в биениях считать падением (для проверки отбоя)"
        required: false
        default: ""


permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHATS: ${{ secrets.ALERT_CHATS }}
        with:
          script: |
            // порог можно занизить при ручном запуске: непроверенная тревога — не тревога
            const LIMIT_MIN = Number(context.payload.inputs?.limit_min ?? 45);
            const GAP_MIN = Number(context.payload.inputs?.gap_min || LIMIT_MIN);
            const TITLE = "Бот расписания не подаёт признаков жизни";
            const { owner, repo } = context.repo;

            // Биений берём несколько: по одному видно только, жив ли бот сейчас,
            // а по череде — был ли в ней провал и когда он кончился.
            let beats = [];
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "heartbeat.yml", per_page: 30,
              });
              beats = runs.data.workflow_runs;
            } catch (e) {
              core.info("обработчик сигнала ещё не заведён: " + e.message);
            }
            const last = beats[0] || null;

            // когда была прошлая проверка: по ней отличаем «вернулся только что»
            // от «вернулся давно, мы уже отбивались»
            let prevCheck = null;
            try {
              const mine = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "watchdog.yml", per_page: 2,
              });
              prevCheck = mine.data.workflow_runs[1] || null;
            } catch (e) {
              core.info("прошлую проверку не прочитал: " + e.message);
            }

            const age = last ? (Date.now() - new Date(last.created_at)) / 60000 : Infinity;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: "open" });
            const alarm = issues.data.find((i) => i.title === TITLE);

            const tg = process.env.ALERT_TOKEN;
            const chats = (process.env.ALERT_CHATS || "").split(",").map((x) => x.trim()).filter(Boolean);

            async function toTelegram(text) {
              for (const chat of chats) {
                const r = await fetch(`https://api.telegram.org/bot${tg}/sendMessage`, {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ chat_id: chat, text, parse_mode: "HTML" }),
                });
                core.info(`телеграм ${chat}: ${r.status}`);
              }
            }

            if (age > LIMIT_MIN) {
              // К последнему биению бот приложил, что у него впереди: по этому
              // видно, насколько тревога срочна. Данные на момент биения, то есть
              // тем старее, чем дольше бот молчит, — но ближайшее занятие от этого
              // ближе не становится, так что для оценки срочности годится.
              const ahead = last && last.display_title && last.display_title !== "сигнал"
                ? last.display_title : null;
              const body = last
                ? `Последний сигнал от бота — ${last.created_at}, это ${Math.round(age)} мин назад.\n\n` +
                  (ahead ? `Ближайшее занятие на тот момент: ${ahead}.\n\n` : "") +
                  "Бот либо не работает, либо не достучится до телеграма: сигнал он шлёт только тогда, " +
                  "когда телеграм ему ответил.\n\n" +
                  "Что смотреть на сервере:\n" +
                  "```\nsystemctl status vzlet-bot\njournalctl -u vzlet-bot -n 50\n```"
                : "Сигналов от бота нет вовсе — похоже, он не запускался ни разу с тех пор, " +
                  "как сторож заведён.";
              if (tg && chats.length) {
                await toTelegram(`<b>${TITLE}</b>\n\n${body}`);
                core.info("тревога отправлена в телеграм");
              } else if (!alarm) {
                // некому написать — оставляем след хотя бы здесь
                await github.rest.issues.create({ owner, repo, title: TITLE, body });
                core.warning("телеграм не настроен, тревога заведена issue");
              }
            } else {
              if (alarm) {
                await github.rest.issues.update({
                  owner, repo, issue_number: alarm.number, state: "closed",
                });
                core.info("бот на связи, прежняя тревога закрыта");
              }

              // ищем ближайший к нам провал в череде биений
              let back = null, gone = 0;
              for (let i = 0; i + 1 < beats.length; i++) {
                const span = (new Date(beats[i].created_at) - new Date(beats[i + 1].created_at)) / 60000;
                if (span > GAP_MIN) { back = beats[i]; gone = span; break; }
              }
              const fresh = back && (!prevCheck ||
                new Date(back.created_at) > new Date(prevCheck.created_at));

              if (fresh) {
                const hours = gone >= 120
                  ? `${Math.round(gone / 60)} ч` : `${Math.round(gone)} мин`;
                const ahead = back.display_title && back.display_title !== "сигнал"
                  ? back.display_title : null;
                const body = `Бот снова на связи с ${back.created_at}.\n\n` +
                  `Молчал ${hours}. Что за это время не ушло в канал, бот не досылает: ` +
                  "напоминание живёт час и после протухает.\n\n" +
                  (ahead ? `Ближайшее занятие: ${ahead}.` : "");
                if (tg && chats.length) {
                  await toTelegram(`<b>Бот расписания снова жив</b>\n\n${body}`);
                  core.info("отбой отправлен в телеграм");
                } else {
                  core.info("отбой некому слать: телеграм не настроен");
                }
              } else {
                core.info(`всё в порядке, последний сигнал ${Math.round(age)} мин назад`);
              }
            }
